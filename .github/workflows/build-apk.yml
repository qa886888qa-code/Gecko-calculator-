name: Build Gecko Calculator APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          unzip -o GeckoCalculatorAndroid.zip -d android-project
          echo "Extracted project files:"
          find android-project -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name gradlew \) -print
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        shell: bash
        run: |
          set -e
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit | xargs -r dirname)"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find Gradle project files in GeckoCalculatorAndroid.zip"
            exit 1
          fi
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          APK_PATH="$(find . -path '*/build/outputs/apk/debug/*.apk' -type f -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "Build finished but APK was not found"
            find . -type f -name '*.apk' -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/apk-output/GeckoCalculator-debug.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeckoCalculator-debug-apk
          path: apk-output/GeckoCalculator-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Gecko Calculator APK build ${{ github.run_number }}
          files: apk-output/GeckoCalculator-debug.apk
          generate_release_notes: true

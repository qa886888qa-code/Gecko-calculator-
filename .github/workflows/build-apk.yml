name: Build Gecko Calculator APK

on:
  push:
    branches: [main]
    paths:
      - 'GeckoCalculatorAndroid.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: unzip -o GeckoCalculatorAndroid.zip -d android-project
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug
      - name: Publish APK as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Gecko Calculator APK build ${{ github.run_number }}
          files: android-project/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
